name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main
  # Fork addition: GitHub does not reliably deliver push/pull_request events to
  # workflows in this fork, so allow running the release manually against an
  # explicit commit on main (the Version Packages merge commit).
  workflow_dispatch:
    inputs:
      release_sha:
        description: Commit SHA on main to release (the Version Packages merge commit)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'changeset-release/main')) &&
      github.repository_owner == 'reintersect'
    name: Build ${{ matrix.binary.name }} ${{ matrix.npm_target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        npm_target:
          - darwin-arm64
          - darwin-x64
          - win32-x64
          - win32-arm64
          - linux-x64
          - linux-arm64
          - linux-arm
        binary:
          - name: tsc-next
            ref: ${{ inputs.release_sha || github.event.pull_request.merge_commit_sha }}
          - name: tsc
            ref: generated/latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.binary.ref }}
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: "**/go.sum"

      - name: Cache Go build
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-release-${{ matrix.binary.name }}-${{ matrix.npm_target }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-build-release-${{ matrix.binary.name }}-${{ matrix.npm_target }}-

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup repo
        run: pnpm setup-repo --ci

      - name: Sync Effect version from release commit
        if: matrix.binary.ref != (inputs.release_sha || github.event.pull_request.merge_commit_sha)
        run: |
          git fetch --depth=1 origin "${{ inputs.release_sha || github.event.pull_request.merge_commit_sha }}"
          git checkout "${{ inputs.release_sha || github.event.pull_request.merge_commit_sha }}" -- _packages/tsgo/package.json
          bash _tools/version-prepare.sh

      - name: Build ${{ matrix.binary.name }} ${{ matrix.npm_target }}
        run: pnpm release:prepare --target ${{ matrix.npm_target }} --binary-name ${{ matrix.binary.name }} --skip-cli

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.npm_target }}__${{ matrix.binary.name }}
          path: |
            _packages/tsgo-${{ matrix.npm_target }}/lib/${{ matrix.binary.name }}${{ startsWith(matrix.npm_target, 'win32-') && '.exe' || '' }}
            _packages/tsgo-${{ matrix.npm_target }}/lib/${{ matrix.binary.name }}${{ startsWith(matrix.npm_target, 'win32-') && '.exe' || '' }}.json

  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'changeset-release/main')) &&
      github.repository_owner == 'reintersect'
    name: Publish Packages
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha || github.event.pull_request.merge_commit_sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download platform binaries
        uses: actions/download-artifact@v8
        with:
          path: _release-artifacts

      - name: Copy binaries into platform packages
        run: |
          for artifact_dir in _release-artifacts/*__*; do
            artifact_name="${artifact_dir##*/}"
            npm_target="${artifact_name%%__*}"
            binary_name="${artifact_name#*__}"
            package_dir="_packages/tsgo-${npm_target}/lib"

            mkdir -p "${package_dir}"
            if [ -f "${artifact_dir}/${binary_name}.exe" ]; then
              cp "${artifact_dir}/${binary_name}.exe" "${package_dir}/${binary_name}.exe"
              cp "${artifact_dir}/${binary_name}.exe.json" "${package_dir}/${binary_name}.exe.json"
            else
              # Artifact upload/download strips file modes; restore the executable
              # bit so npm records it in the tarball and installed binaries can be
              # spawned directly (editor tsdk integration, tsgo launcher).
              cp "${artifact_dir}/${binary_name}" "${package_dir}/${binary_name}"
              cp "${artifact_dir}/${binary_name}.json" "${package_dir}/${binary_name}.json"
              chmod 755 "${package_dir}/${binary_name}"
            fi
          done

      - name: Build CLI bundle
        run: pnpm build:cli

      - name: Publish packages
        run: pnpm changeset:publish
        env:
          NPM_CONFIG_PROVENANCE: "true"
          # Token-based auth for the first publishes (the packages must exist on
          # npm before Trusted Publishing can be registered for them). Once
          # Trusted Publishing is configured for all eight packages against this
          # repo + workflow, remove NODE_AUTH_TOKEN and rely on OIDC alone.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
